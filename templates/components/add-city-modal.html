<template id="add-city-modal-template">
    <dialog class="dui-modal items-start pt-7 md:items-center md:pt-0" id="addCityModal">
        <div class="dui-modal-box flex max-h-[calc(100dvh-3.5rem)] origin-top flex-col overflow-hidden p-0 md:origin-center">
            <h3 class="shrink-0 border-b border-base-300 px-6 pt-6 pb-4 font-bold text-lg text-base-content" id="addCityModalLabel">
                Добавить посещённый город
            </h3>

            <form class="flex min-h-0 flex-1 flex-col" id="form-add-city" method="dialog">
                {% csrf_token %}
                <input type="hidden" id="city-id" name="city" value="">
                <input type="hidden" name="from" value="visited_cities_map">

                <div class="flex min-h-0 flex-1 flex-col overflow-hidden px-6 pt-4 pb-6 md:block md:overflow-y-auto"
                     id="add-city-modal-content">
                    <div class="flex min-h-0 flex-1 flex-col md:mb-6 md:block md:flex-none" id="city-selection-fields" hidden>
                        <button type="button"
                                class="dui-btn dui-btn-ghost dui-btn-sm mb-2 self-start md:hidden"
                                data-city-search-back
                                hidden>
                            Назад
                        </button>
                        <div class="dui-form-control flex min-h-0 flex-1 flex-col">
                            <label class="dui-label mb-2" for="add-city-city">
                                <span class="dui-label-text font-semibold text-base-content">Город</span>
                            </label>
                            <div class="flex min-h-0 flex-1 flex-col md:relative md:block" data-city-combobox>
                                <div class="relative" data-city-combobox-control>
                                    <input class="dui-input dui-input-bordered w-full pr-18"
                                        id="add-city-city"
                                        data-city-combobox-input
                                        type="search"
                                        placeholder="Начните вводить название города"
                                        autocomplete="off">
                                    <button class="dui-btn dui-btn-ghost dui-btn-circle dui-btn-sm absolute end-2 top-1/2 -translate-y-1/2"
                                            type="button"
                                            data-city-combobox-clear
                                            aria-label="Очистить название города"
                                            hidden>
                                        <svg aria-hidden="true" class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="m6 6 12 12M18 6 6 18" />
                                        </svg>
                                    </button>
                                <span class="dui-loading dui-loading-spinner dui-loading-sm absolute end-10 top-1/2 -translate-y-1/2"
                                       data-city-combobox-loading
                                       aria-label="Загрузка подсказок"
                                       hidden></span>
                                </div>
                                <p class="mt-3 text-sm text-base-content/80 md:hidden" data-city-search-instruction>
                                    Начните вводить название города
                                </p>
                                <div class="mt-2 min-h-0 max-h-[calc(100dvh-15rem)] overflow-y-auto rounded-box border border-base-content/30 bg-base-100 shadow-lg shadow-base-content/20 has-[[hidden]]:hidden md:absolute md:top-full md:start-0 md:z-30 md:max-h-64 md:w-full"
                                     data-city-combobox-positioner>
                                    <ul class="flex w-full flex-col"
                                        data-city-combobox-content></ul>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="min-h-0 flex-1 overflow-y-auto md:overflow-visible" id="visit-details">
                        <div class="dui-card bg-base-200 border border-base-300 mb-6" id="city-summary-card">
                            <div class="dui-card-body relative p-4 pe-14">
                                <h4 class="dui-card-title text-base" id="city-title-in-modal"></h4>
                                <p class="text-sm text-base-content/80" id="region-title-in-modal"></p>
                                <button type="button"
                                        class="dui-btn dui-btn-ghost dui-btn-circle dui-btn-sm absolute end-2 top-2"
                                        data-change-city
                                        aria-label="Изменить город"
                                        title="Изменить город"
                                        hidden>
                                    <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <div class="dui-form-control">
                            <label class="dui-label mb-2" for="date-of-visit">
                                <span class="dui-label-text font-semibold text-base-content">Дата посещения</span>
                            </label>
                            <div class="relative">
                                <div class="dui-join w-full">
                                    <input type="text"
                                           id="date-of-visit"
                                           name="date_of_visit"
                                           class="dui-input dui-input-bordered dui-join-item min-w-0 flex-1"
                                           placeholder="Выберите дату"
                                           autocomplete="off"
                                           readonly>
                                    <button type="button"
                                            id="today-button"
                                            class="dui-btn dui-join-item">
                                        Сегодня
                                    </button>
                                    <button type="button"
                                            id="yesterday-button"
                                            class="dui-btn dui-join-item">
                                        Вчера
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="dui-divider"></div>

                        <div class="dui-form-control">
                            <label class="cursor-pointer flex w-full items-center gap-4">
                                <div class="min-w-0 flex-1">
                                    <span class="dui-label-text font-semibold text-base-content">Наличие сувенира из города</span>
                                    <span class="block text-sm text-base-content/80 mt-1">
                                        Отметьте этот пункт, если у Вас в коллекции есть сувенир из города.
                                    </span>
                                </div>
                                <input type="checkbox"
                                       name="has_magnet"
                                       id="magnet-checkbox"
                                       class="dui-toggle dui-toggle-primary dui-toggle-lg shrink-0">
                            </label>
                        </div>

                        <div class="dui-divider"></div>

                        <div class="dui-form-control">
                            <label class="dui-label mb-2">
                                <span class="dui-label-text font-semibold text-base-content">
                                    Оценка города
                                    <span class="dui-text-error">*</span>
                                </span>
                            </label>
                            <div class="flex items-center justify-between gap-4">
                                <span class="text-sm text-base-content/80">
                                    Поставьте оценку городу. 1 - плохо, 5 - отлично.
                                </span>
                                <div class="dui-rating" id="rating-container">
                                    <input type="radio" name="rating-radio" value="1" class="dui-mask dui-mask-star-2 bg-warning" aria-label="1 звезда" />
                                    <input type="radio" name="rating-radio" value="2" class="dui-mask dui-mask-star-2 bg-warning" aria-label="2 звезды" />
                                    <input type="radio" name="rating-radio" value="3" class="dui-mask dui-mask-star-2 bg-warning" aria-label="3 звезды" />
                                    <input type="radio" name="rating-radio" value="4" class="dui-mask dui-mask-star-2 bg-warning" aria-label="4 звезды" />
                                    <input type="radio" name="rating-radio" value="5" class="dui-mask dui-mask-star-2 bg-warning" aria-label="5 звезд" />
                                </div>
                            </div>
                            <input type="hidden"
                                   name="rating"
                                   id="id_rating"
                                   value=""
                                   required>
                        </div>

                        <div class="dui-divider"></div>

                        <div class="dui-form-control">
                            <label class="dui-label mb-2">
                                <span class="dui-label-text font-semibold text-base-content">Впечатления о городе</span>
                            </label>
                            <textarea class="dui-textarea dui-textarea-bordered w-full"
                                      id="impression"
                                      name="impression"
                                      rows="4"
                                      placeholder="Опишите свои впечатления о городе..."></textarea>
                        </div>
                    </div>
                </div>

                <div class="dui-modal-action mt-0 shrink-0 border-t border-base-300 px-6 py-4"
                     id="add-city-modal-actions">
                    <button type="button"
                            class="dui-btn dui-btn-ghost"
                            id="btn-close-modal">
                        Закрыть
                    </button>
                    <button type="submit"
                            class="dui-btn dui-btn-primary"
                            id="btn_add-visited-city"
                            disabled>
                        <span>Добавить</span>
                    </button>
                </div>
            </form>
        </div>
        <div id="add-city-visit-calendar" class="vc fixed z-[1001] w-fit" data-vc-calendar-hidden></div>
        <form method="dialog" class="dui-modal-backdrop">
            <button>close</button>
        </form>
    </dialog>
</template>
